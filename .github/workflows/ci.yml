# Build, format, static analysis (analyzers as errors) and tests. See ADR-0015.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore ProcesosLegalesLab.slnx

      - name: Verify formatting (.editorconfig)
        run: dotnet format ProcesosLegalesLab.slnx --verify-no-changes --no-restore --verbosity diagnostic

      - name: Build (analyzers, warnings as errors)
        run: dotnet build ProcesosLegalesLab.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test with coverage
        run: >
          dotnet test ProcesosLegalesLab.slnx -c Release --no-build
          --logger "trx;LogFilePrefix=results"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: TestResults/coverage
          reporttypes: MarkdownSummaryGithub;Cobertura
          assemblyfilters: '-*.Tests;-Procesos.UnitTests;-Procesos.IntegrationTests'
          classfilters: '-*.Migrations.*'

      - name: Publish coverage summary
        if: always()
        run: cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults
          retention-days: 14

  angular:
    name: Angular ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [procesos-chat-web, procesos-backoffice-web]
    defaults:
      run:
        working-directory: src/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check formatting (Prettier)
        run: npx prettier --check "src/**/*.{ts,html,css,scss}"

      - name: Build (production)
        run: npm run build

      - name: Unit tests (Vitest)
        run: npx ng test --watch=false
